apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicdtest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jjoonior/github-action-practice.git'
    targetRevision: main
    path: app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
